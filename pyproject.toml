[project]
name = "computer-use-agent"
version = "0.1.0"
description = "Modern Python agent template using uv + OpenAI Agents SDK"
readme = "README.md"
requires-python = ">=3.12,<3.13"
keywords = ["agents", "llm", "openai", "uv"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
]

# Runtime deps
dependencies = [
  "azure-servicebus>=7.14.2",
  "cua-agent[all]>=0.4.27",
  "cua-computer>=0.4.5",
  "httpx[http2]>=0.28.1",
  "loguru>=0.7.3",
  "openai>=1.105.0",
  "openai-agents>=0.2.11",
  "pydantic>=2.11.7",
  "python-dotenv>=1.1.1",
  "tenacity>=9.1.2",
  "websockets>=15.0.1",
  "opencv-python>=4.11.0.86",
  "paddleocr[all]>=3.2.0",
  "paddlepaddle>=3.2.0",
  "pillow>=11.3.0",
]


[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E","F","I","UP","B","SIM","C4","PIE","RUF"]
ignore = ["E203","E501"]  # leave formatting to ruff formatter, cap lines via formatter
exclude = ["dist", "build", ".venv"]
fix = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
pythonpath = "."
addopts = "-q"
testpaths = ["tests"]


[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.7",
  "pyright>=1.1.379",
  "pre-commit>=3.7.1",
  "pytest-asyncio>=1.2.0",
]
